name: Deploy Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, cooking-runner]
    


    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # TEMPORARY (until the move to Coolify): the server's CLI php.ini disables
      # proc_open/exec for every user. Lift it for this deploy's own commands only;
      # Composer passes the setting on to the `@php artisan` scripts it runs.
      - name: Setup PHP dependencies
        run: php -d disable_functions=mail "$(command -v composer)" install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node dependencies
        run: bun install --frozen-lockfile

      - name: Build Frontend Assets
        run: bun run build

      - name: Deploy to Production Directory
        # Using rsync to copy from the runner's workspace (./backend) to the public_html directory.
        # Since we are running AS the user 'syrian' (per instructions), we can rsync locally.
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='production.env' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/public' \
            --exclude='public/storage' \
            ./ /home/syrian/domains/food.syrian.zone/public_html/

      - name: Execute Post-Deployment Commands
        working-directory: /home/syrian/domains/food.syrian.zone/public_html
        run: |
          # TEMPORARY: see "Setup PHP dependencies" — artisan needs proc_open.
          artisan() { php -d disable_functions=mail artisan "$@"; }

          # Ensure .env exists (assuming it's already there on the server, but good safety)
          if [ ! -f .env ]; then
              echo "::error::No .env file found in production directory!"
              exit 1
          fi

          # Run Migrations
          artisan migrate --force

          # Optimize
          artisan config:cache
          artisan route:cache
          artisan view:cache
          artisan event:cache

          # Storage Link (Idempotent)
          artisan storage:link --force

          # Restart Queue Workers
          artisan queue:restart

          # Stop Inertia SSR Server (forces process manager to reload fresh SSR bundle)
          artisan inertia:stop-ssr || true

          # Fix Permissions
          # Ensure backend storage is writable
          chmod -R 775 storage bootstrap/cache

          # Ensure parent directories are traversable by web server (o+x)
          # This fixes 403 errors if the web server runs as a different user
          chmod 711 /home/syrian
          chmod 711 /home/syrian/domains
          chmod 711 /home/syrian/domains/food.syrian.zone
          chmod 711 /home/syrian/domains/food.syrian.zone/public_html
